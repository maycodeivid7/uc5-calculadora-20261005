<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <main
      class="container min-vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="card shadow p-4" style="max-width: 400px; width: 100%">
        <h1 class="text-center mb-2">Calculadora</h1>
        <p class="text-center text-secondary mb-4">
          Digite dois números e escolha uma operação.
        </p>
        <div class="mb-3">
          <label for="number1" class="form-label"> Primeiro número </label>
          <input
            type="number"
            id="number1"
            class="form-control"
            placeholder="Digite um número"
          />
        </div>
        <div class="mb-3">
          <label for="number2" class="form-label"> Segundo número </label>
          <input
            type="number"
            id="number2"
            class="form-control"
            placeholder="Digite um número"
          />
        </div>
        <div class="row g-2 mb-3">
          <div class="col-3">
            <button class="btn btn-primary w-100 fs-4" onclick="calcular('+')">
              +
            </button>
          </div>
          <div class="col-3">
            <button class="btn btn-primary w-100 fs-4" onclick="calcular('-')">
              −
            </button>
          </div>
          <div class="col-3">
            <button class="btn btn-primary w-100 fs-4" onclick="calcular('*')">
              ×
            </button>
          </div>
          <div class="col-3">
            <button class="btn btn-primary w-100 fs-4" onclick="calcular('/')">
              ÷
            </button>
          </div>
        </div>
        <button class="btn btn-outline-secondary w-100 mb-3" onclick="limpar()">
          Limpar
        </button>
        <div id="error" class="text-danger text-center mb-3"></div>
        <div class="alert alert-light text-center mb-0">
          <div class="text-secondary">Resultado</div>
          <div id="result" class="fs-2 fw-bold">0</div>
        </div>
      </div>
    </main>
    <script>
      function calcular(operacao) {
        const num1 = parseFloat(document.getElementById("number1").value);
        const num2 = parseFloat(document.getElementById("number2").value);
        const resultElement = document.getElementById("result");
        const errorElement = document.getElementById("error");

        errorElement.textContent = "";

        if (isNaN(num1) || isNaN(num2)) {
          errorElement.textContent = "Por favor, insira números válidos.";
          resultElement.textContent = "0";
          return;
        }

        let resultado;
        switch (operacao) {
          case '+':
            resultado = num1 + num2;
            break;
          case '-':
            resultado = num1 - num2;
            break;
          case '*':
            resultado = num1 * num2;
            break;
          case '/':
            if (num2 === 0) {
              errorElement.textContent = "Erro: Divisão por zero não é permitida.";
              resultElement.textContent = "0";
              return;
            }
            resultado = num1 / num2;
            break;
          default:
            errorElement.textContent = "Operação inválida.";
            resultElement.textContent = "0";
            return;
        }

        resultElement.textContent = resultado.toFixed(2);
      }

      function limpar() {
        document.getElementById("number1").value = "";
        document.getElementById("number2").value = "";
        document.getElementById("result").textContent = "0";
        document.getElementById("error").textContent = "";
      }
    </script>
  </body>
</html>
